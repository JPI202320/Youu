<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día del Hotel Wheel ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .font-cursive {
            font-family: 'Dancing Script', cursive;
        }

        /* Floating Hearts Animation */
        .heart {
            position: absolute;
            top: -10vh;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.5rem;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 0;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* Envelope Styles */
        .envelope-wrapper {
            position: relative;
            width: 320px;
            height: 220px;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.3s ease;
        }
        
        .envelope-wrapper:hover {
            transform: scale(1.05);
        }

        /* Back of the envelope */
        .env-back {
            position: absolute;
            inset: 0;
            background-color: #d6336c;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            z-index: 1;
        }

        /* The Letter inside */
        .letter {
            position: absolute;
            left: 15px;
            right: 15px;
            bottom: 10px;
            height: 190px;
            background-color: #fff9fa;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 2;
            transition: transform 1s ease-in-out, z-index 0s 0.5s;
        }

        .letter p {
            margin: 0;
            font-size: 1.6rem;
            color: #d6336c;
            line-height: 1.4;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            transition-delay: 0.8s;
        }

        /* Front flaps using clip-path */
        .env-front {
            position: absolute;
            inset: 0;
            background-color: #e64980;
            border-radius: 10px;
            clip-path: polygon(0 0, 50% 50%, 100% 0, 100% 100%, 0 100%);
            z-index: 3;
            pointer-events: none;
        }

        /* Top flap that opens */
        .env-top-flap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60%;
            background-color: #f06595;
            border-radius: 10px 10px 0 0;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top;
            transition: transform 0.6s ease-in-out;
            z-index: 4;
            pointer-events: none;
        }

        /* Seal */
        .env-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            z-index: 5;
            transition: opacity 0.3s;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        /* Helper tooltip */
        .click-me {
            position: absolute;
            bottom: -50px;
            width: 100%;
            text-align: center;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            animation: bounce 2s infinite;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* Open state classes */
        .is-open .env-top-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }
        
        .is-open .env-seal {
            opacity: 0;
        }

        .is-open .letter {
            transform: translateY(-160px);
            z-index: 10;
        }

        .is-open .letter p {
            opacity: 1;
        }

        .is-open .click-me {
            opacity: 0;
        }

        @media (max-width: 400px) {
            .envelope-wrapper {
                width: 280px;
                height: 190px;
            }
            .letter {
                height: 170px;
            }
            .letter p {
                font-size: 1.3rem;
            }
            .is-open .letter {
                transform: translateY(-130px);
            }
        }
    </style>
</head>
<body>

    <!-- YouTube Player (Hidden) -->
    <div id="youtube-player" style="display:none;"></div>

    <h1 class="font-cursive text-white text-4xl md:text-5xl mb-12 text-center drop-shadow-md z-10 px-4">
        ¡Feliz Día del Hotel Wheel! 🚗💖
    </h1>

    <div class="envelope-wrapper" id="envelope" onclick="openEnvelope()">
        <div class="env-back"></div>
        
        <div class="letter" id="letter">
            <p class="font-cursive">
                "mi vida bella tal vez no tea muto pero te lo doy con muto cariño y amor pa ti jiji feliz dia del hotel wheel mi amor te amuuuuu"
            </p>
        </div>
        
        <div class="env-front"></div>
        <div class="env-top-flap"></div>
        <div class="env-seal">❤️</div>
        
        <div class="click-me">¡Toca para abrir! ✨</div>
    </div>

    <script>
        let isOpen = false;
        let ytPlayer;

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: 'xvwg5Ub-hII', 
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'modestbranding': 1,
                    'rel': 0
                }
            });
        }

        function openEnvelope() {
            if (isOpen) return;
            
            isOpen = true;
            const envelope = document.getElementById('envelope');
            
            envelope.classList.add('is-open');

            if (ytPlayer && ytPlayer.playVideo) {
                ytPlayer.playVideo();
            }

            createHeartShower();
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            const heartEmojis = ['❤️', '💖', '💗', '💓', '💕'];
            heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            heart.style.fontSize = Math.random() * 1.5 + 1 + 'rem';
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        let heartInterval = setInterval(createHeart, 800);

        function createHeartShower() {
            clearInterval(heartInterval);
            let showerInterval = setInterval(createHeart, 150);
            
            setTimeout(() => {
                clearInterval(showerInterval);
                heartInterval = setInterval(createHeart, 600);
            }, 4000);
        }

        for(let i=0; i<5; i++) {
            setTimeout(createHeart, i * 200);
        }
    </script>
</body>
</html>
